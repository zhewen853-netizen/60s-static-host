
name: Daily 60s News Sync

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date (YYYY-MM-DD)"
        required: false
        type: string

  schedule:
    # Beijing / Singapore time: 08:30 and 10:30
    - cron: "30 0,2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            TARGET_DATE="$INPUT_DATE"
          else
            TARGET_DATE=$(TZ=Asia/Shanghai date +%F)
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $TARGET_DATE"
            exit 1
          fi

          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Target date: $TARGET_DATE"

      - name: Download and validate news
        env:
          TARGET_DATE: ${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail

          JSON_FILE="static/60s/${TARGET_DATE}.json"
          PNG_FILE="static/images/${TARGET_DATE}.png"

          if [ -s "$JSON_FILE" ] && [ -s "$PNG_FILE" ]; then
            echo "Both files already exist. Skipping."
            exit 0
          fi

          BASE="https://raw.githubusercontent.com/vikiboss/60s-static-host/main/static"

          mkdir -p static/60s static/images

          curl -fSL --retry 3 --retry-delay 10 \
            "${BASE}/60s/${TARGET_DATE}.json" \
            -o news.tmp.json

          curl -fSL --retry 3 --retry-delay 10 \
            "${BASE}/images/${TARGET_DATE}.png" \
            -o news.tmp.png

          jq -e --arg d "$TARGET_DATE" \
            '.date == $d and (.news | type == "array" and length > 0)' \
            news.tmp.json > /dev/null

          python3 -c '
          with open("news.tmp.png", "rb") as f:
              assert f.read(8) == b"\x89PNG\r\n\x1a\n", "Invalid PNG"
          '

          mv news.tmp.json "$JSON_FILE"
          mv news.tmp.png "$PNG_FILE"

          echo "News JSON and PNG saved successfully."

      - name: Commit and push changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add static/60s/ static/images/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily news"
            git push
            echo "Changes pushed successfully"
          fi
